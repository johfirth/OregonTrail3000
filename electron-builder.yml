appId: com.artemistrail.app
productName: Artemis Trail
copyright: Copyright © 2026 OregonTrail3000 Team

directories:
  output: dist/desktop
  buildResources: resources

files:
  - out/**/*
  - "!node_modules"

win:
  target: nsis
  icon: resources/icon.ico

mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  category: public.app-category.games

linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Game

nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false

publish:
  provider: github
  owner: johfirth
  repo: OregonTrail3000
